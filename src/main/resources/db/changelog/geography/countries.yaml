databaseChangeLog:

  - changeSet:
      id: create-countries-table
      author: tijaro
      changes:

        - createTable:
            tableName: countries
            columns:

              - column:
                  name: uid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: modified_by
                  type: UUID

              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: deleted_by
                  type: UUID

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: official_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: native_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: iso2_code
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: iso3_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: numeric_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: capital
                  type: VARCHAR(100)

              - column:
                  name: population
                  type: BIGINT

              - column:
                  name: area_km2
                  type: NUMERIC(15,2)