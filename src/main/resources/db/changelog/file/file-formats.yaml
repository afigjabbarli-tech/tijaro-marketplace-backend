databaseChangeLog:
  - changeSet:
      id: create-file-formats-table
      author: tijaro
      changes:
        - createTable:
            tableName: file_formats
            columns:
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: extension
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: mime_type
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: category_uid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: modified_by
                  type: UUID

              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: deleted_by
                  type: UUID

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: false

        - addUniqueConstraint:
            tableName: file_formats
            columnNames: extension, mime_type
            constraintName: uk_file_format_extension_mime_type

        - addForeignKeyConstraint:
            baseTableName: file_formats
            baseColumnNames: category_uid
            referencedTableName: file_categories
            referencedColumnNames: uid
            constraintName: fk_file_formats_category

  - changeSet:
      id: rename-file-formats-category-uid-to-file-category-uid
      author: tijaro
      changes:
      - renameColumn:
          tableName: file_formats
          oldColumnName: category_uid
          newColumnName: file_category_uid
          columnDataType: UUID

