databaseChangeLog:

  - changeSet:
      id: create-file-attachments-table
      author: tijaro
      changes:

        - createTable:
            tableName: file_attachments
            columns:

              - column:
                  name: uid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: file_uid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: owner_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: owner_uid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: file_purpose
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: sort_order
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: modified_by
                  type: UUID

              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: deleted_by
                  type: UUID

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: file_attachments
            baseColumnNames: file_uid
            referencedTableName: files
            referencedColumnNames: uid
            constraintName: fk_file_attachments_file

        - createIndex:
            tableName: file_attachments
            indexName: idx_file_attachments_owner
            columns:
              - column:
                  name: owner_type
              - column:
                  name: owner_uid

        - createIndex:
            tableName: file_attachments
            indexName: idx_file_attachments_file
            columns:
              - column:
                  name: file_uid